version: "3.7"

services:
  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
    command: "-js"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-node-1:
    image: bitnamilegacy/redis-cluster:7.0
    ports:
      - "6381:6379"
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_NODES=redis-node-1 redis-node-2 redis-node-3'
      - 'REDIS_CLUSTER_REPLICAS=0'
      - 'REDIS_CLUSTER_CREATOR=yes'

  redis-node-2:
    image: bitnamilegacy/redis-cluster:7.0
    ports:
      - "6382:6379"
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_NODES=redis-node-1 redis-node-2 redis-node-3'

  redis-node-3:
    image: bitnamilegacy/redis-cluster:7.0
    ports:
      - "6383:6379"
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_NODES=redis-node-1 redis-node-2 redis-node-3'

  #redis-cluster-init:
  #  image: redis:6.2
  #  restart: 'no'
  #  depends_on:
  #    - redis-node-1
  #    - redis-node-2
  #    - redis-node-3
  #  entrypoint: []
  #  command:
  #    - /bin/bash
  #    - -c
  #    - redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 --cluster-replicas 0 --cluster-yes

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # Kafka 4.x is KRaft-only (no Zookeeper), matching our production version.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9094
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9094,EXTERNAL://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,EXTERNAL://127.0.0.1:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    ports:
      - "9092:9092"
      - "9093:9093"
